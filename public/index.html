<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JALREKHA - Scenario Planner</title>
    <link rel="stylesheet" href="/styles.css">
    <!-- MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@4.7.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@4.7.0/dist/maplibre-gl.css" rel="stylesheet" />
</head>
<body>
    <header class="app-header">
        <div class="logo">
            <span class="mark">≈</span>
            <h1>JALREKHA</h1>
        </div>
        <div class="title">Pune · Scenario planner</div>
        <div class="header-controls">
            <button id="btn-methods" class="btn secondary">Methods & Data</button>
            <button id="btn-export" class="btn secondary">Export</button>
            <button id="btn-reset" class="btn primary">Reset</button>
        </div>
    </header>

    <main class="app-main">
        <aside class="panel left-panel">
            <section class="control-group">
                <h2>Flood Scenario</h2>
                <div class="slider-container">
                    <label for="water-level">Relative Water Level: <span id="level-display">0.0</span> m</label>
                    <input type="range" id="water-level" min="0" max="3" step="0.5" value="0">
                </div>
            </section>
            <section class="control-group">
                <h2>Capacity Overrides</h2>
                <div id="shelter-controls">
                    <!-- Dynamic shelter controls will go here -->
                </div>
            </section>
            <section class="control-group">
                <h2>Status</h2>
                <div id="status-message">Ready</div>
            </section>
        </aside>

        <section class="map-container">
            <div id="map"></div>
            <div class="compact-summary" id="summary-strip">
                <div class="metric">Population: <span id="stat-pop">-</span></div>
                <div class="metric allocated">Allocated: <span id="stat-alloc">-</span></div>
                <div class="metric unallocated">Unallocated: <span id="stat-unalloc">-</span></div>
                <div class="metric capacity">Usable Capacity: <span id="stat-cap">-</span></div>
            </div>
        </section>

        <aside class="panel right-panel" id="inspector-panel" style="display: none;">
            <h2>Inspector</h2>
            <div id="inspector-content">
                Select an origin or shelter to inspect.
            </div>
        </aside>
    </main>

    <script src="/js/main.js"></script>
</body>
</html>
